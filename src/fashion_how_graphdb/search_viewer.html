<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fashion-How Graph Search</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #20242c;
      --muted: #677080;
      --line: #d9dee7;
      --accent: #116c7b;
      --accent-bg: #d9f3f0;
      --warm: #f4b942;
      --error: #b42318;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button, input, select, textarea {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(360px, 460px) minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 100vh;
    }

    .main {
      padding: 20px;
      display: grid;
      grid-template-rows: auto minmax(240px, 34vh) minmax(0, 1fr);
      gap: 18px;
      min-width: 0;
    }

    h1 {
      font-size: 22px;
      line-height: 1.2;
      margin: 0;
      letter-spacing: 0;
    }

    h2 {
      font-size: 15px;
      margin: 0 0 10px;
      letter-spacing: 0;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .query-box {
      display: grid;
      gap: 10px;
    }

    textarea {
      width: 100%;
      min-height: 86px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      background: #fbfcfd;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 88px;
      gap: 10px;
      align-items: end;
    }

    select, input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      background: #fbfcfd;
      color: var(--text);
    }

    .limit-row {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 10px;
    }

    .run-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      min-height: 42px;
    }

    button:disabled {
      opacity: 0.55;
      cursor: progress;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      min-height: 20px;
    }

    .error {
      color: var(--error);
    }

    .catalog {
      overflow: auto;
      padding-right: 4px;
      display: grid;
      gap: 16px;
    }

    .group {
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .group-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .group-title span {
      color: var(--muted);
      font-size: 12px;
    }

    details.category-section {
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }

    details.category-section > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0 8px;
    }

    details.category-section > summary::-webkit-details-marker {
      display: none;
    }

    details.category-section > summary::after {
      content: "+";
      width: 22px;
      height: 22px;
      border: 1px solid var(--line);
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      color: var(--muted);
      flex: 0 0 auto;
    }

    details.category-section[open] > summary::after {
      content: "-";
      background: #f1f4f7;
    }

    .category-body {
      display: grid;
      gap: 12px;
      padding: 2px 0 8px;
    }

    .subgroup {
      display: grid;
      gap: 6px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .chip {
      border: 1px solid var(--line);
      background: #f9fafb;
      color: #384252;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      line-height: 1.2;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .chip.selected {
      border-color: #0d7c70;
      background: var(--accent-bg);
      color: #064f49;
      font-weight: 650;
    }

    .chip.type-selected {
      border-color: #c88409;
      background: #fff2cf;
      color: #6b4400;
      font-weight: 650;
    }

    .chip.excluded {
      border-color: #d92d20;
      background: #fee4e2;
      color: #8a1f15;
      font-weight: 650;
      text-decoration: line-through;
    }

    .category-section {
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }

    .category-section summary {
      cursor: pointer;
      list-style-position: inside;
      color: var(--text);
    }

    .category-section summary::marker {
      color: var(--accent);
    }

    .category-section[open] summary {
      margin-bottom: 10px;
    }

    .category-body {
      display: grid;
      gap: 13px;
      padding-left: 8px;
      border-left: 2px solid var(--accent-bg);
    }

    .subgroup {
      display: grid;
      gap: 6px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .metric strong {
      display: block;
      font-size: 22px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
    }

    .cypher-wrap {
      background: #151922;
      color: #e8edf5;
      border-radius: 8px;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    .cypher-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid #2d3442;
    }

    .cypher-head h2 {
      margin: 0;
      color: white;
    }

    pre {
      margin: 0;
      overflow: auto;
      padding: 14px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .results {
      min-height: 0;
      overflow: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }

    .item {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .item img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
      background: #e8ebf0;
    }

    .item-body {
      padding: 10px;
      display: grid;
      gap: 6px;
    }

    .item-title {
      font-weight: 700;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .item-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .item-details {
      border-top: 1px solid var(--line);
      margin-top: 4px;
      padding-top: 8px;
    }

    .item-details summary {
      cursor: pointer;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      list-style-position: inside;
    }

    .filter-list {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }

    .filter-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      font-size: 12px;
      line-height: 1.35;
    }

    .filter-row b {
      color: #2d3748;
      overflow-wrap: anywhere;
    }

    .filter-row span {
      color: var(--muted);
      font-family: var(--mono);
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 28px;
      color: var(--muted);
      text-align: center;
      background: rgba(255, 255, 255, 0.55);
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        min-height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .main {
        grid-template-rows: auto 320px auto;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div>
        <h1>Fashion-How Graph Search</h1>
      </div>

      <form class="query-box" id="searchForm">
        <div>
          <label for="queryInput">자연어 쿼리</label>
          <textarea id="queryInput" placeholder="꽃놀이 가서 입기 좋은 샛노랑 가디건">꽃놀이 가서 입기 좋은 샛노랑 가디건</textarea>
        </div>

        <div class="controls">
          <div>
            <label for="modelSelect">LLM 모델</label>
            <select id="modelSelect"></select>
          </div>
          <div>
            <label for="limitInput">Limit</label>
            <input id="limitInput" type="number" min="1" max="100" value="20">
          </div>
        </div>

        <div class="limit-row">
          <div>
            <label for="confidenceInput">Min confidence</label>
            <input id="confidenceInput" type="number" min="0" max="1" step="0.05" placeholder="">
          </div>
          <div>
            <label for="scoreInput">Min score</label>
            <input id="scoreInput" type="number" min="0" max="1" step="0.05" placeholder="">
          </div>
          <div class="run-row">
            <div id="status" class="status">카탈로그를 불러오는 중...</div>
            <button id="runButton" type="submit">검색</button>
          </div>
        </div>
      </form>

      <section class="catalog" id="catalog"></section>
    </aside>

    <main class="main">
      <section class="summary">
        <div class="metric"><strong id="typeCount">0</strong><span>선택 타입</span></div>
        <div class="metric"><strong id="filterCount">0</strong><span>선택 속성</span></div>
        <div class="metric"><strong id="resultCount">0</strong><span>검색 결과</span></div>
      </section>

      <section class="cypher-wrap">
        <div class="cypher-head">
          <h2>최종 Cypher</h2>
          <span id="modelBadge" class="status"></span>
        </div>
        <pre id="cypherOutput">검색을 실행하면 최종 Cypher가 표시됩니다.</pre>
      </section>

      <section class="results">
        <h2>선택된 옷</h2>
        <div id="results" class="grid">
          <div class="empty">검색 결과 이미지가 여기에 표시됩니다.</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const state = {
      catalog: null,
      extraction: {
        item_type_codes: [],
        common_filters: [],
        category_filters: [],
        excluded_common_filters: [],
        excluded_category_filters: [],
        description_query: "",
        style_axis_targets: []
      },
      results: []
    };

    const els = {
      form: document.getElementById("searchForm"),
      query: document.getElementById("queryInput"),
      model: document.getElementById("modelSelect"),
      limit: document.getElementById("limitInput"),
      confidence: document.getElementById("confidenceInput"),
      score: document.getElementById("scoreInput"),
      status: document.getElementById("status"),
      run: document.getElementById("runButton"),
      catalog: document.getElementById("catalog"),
      cypher: document.getElementById("cypherOutput"),
      results: document.getElementById("results"),
      typeCount: document.getElementById("typeCount"),
      filterCount: document.getElementById("filterCount"),
      resultCount: document.getElementById("resultCount"),
      modelBadge: document.getElementById("modelBadge")
    };

    function selectedKeys() {
      const keys = new Set();
      for (const code of state.extraction.item_type_codes || []) {
        keys.add(`type:${code}`);
      }
      for (const filter of state.extraction.common_filters || []) {
        keys.add(`common:${filter.group}:${filter.value}`);
      }
      for (const filter of state.extraction.category_filters || []) {
        keys.add(`category:${filter.type_code}:${filter.group}:${filter.value}`);
      }
      for (const filter of state.extraction.excluded_common_filters || []) {
        keys.add(`exclude:common:${filter.group}:${filter.value}`);
      }
      for (const filter of state.extraction.excluded_category_filters || []) {
        keys.add(`exclude:category:${filter.type_code}:${filter.group}:${filter.value}`);
      }
      for (const target of state.extraction.style_axis_targets || []) {
        keys.add(`style:${target.axis}`);
      }
      return keys;
    }

    function chip(key, text, selectedClass = "selected") {
      const keys = selectedKeys();
      const excludedKey = key.startsWith("category:")
        ? `exclude:${key}`
        : key.startsWith("common:")
          ? `exclude:${key}`
          : "";
      const excluded = excludedKey && keys.has(excludedKey);
      const selected = keys.has(key);
      const className = excluded ? "excluded" : selected ? selectedClass : "";
      return `<span class="chip ${className}" data-key="${escapeHtml(key)}">${escapeHtml(text)}</span>`;
    }

    function categoryHasSelection(typeCode) {
      return [...(state.extraction.category_filters || []), ...(state.extraction.excluded_category_filters || [])]
        .some(filter => filter.type_code === typeCode);
    }

    function renderCatalog() {
      if (!state.catalog) return;
      const catalog = state.catalog;
      const parts = [];

      parts.push(`<section class="group">
        <div class="group-title"><h2>의류 타입</h2><span>${Object.keys(catalog.item_types).length}</span></div>
        <div class="chips">${Object.entries(catalog.item_types).map(([code, name]) => chip(`type:${code}`, `${code} · ${name}`, "type-selected")).join("")}</div>
      </section>`);

      for (const [group, data] of Object.entries(catalog.common_groups)) {
        parts.push(`<section class="group">
          <div class="group-title"><h2>${escapeHtml(group)}</h2><span>${data.values.length}</span></div>
          <div class="chips">${data.values.map(value => chip(`common:${group}:${value}`, value)).join("")}</div>
        </section>`);
      }

      if (catalog.style_axes) {
        parts.push(`<section class="group">
          <div class="group-title"><h2>style axes</h2><span>${Object.keys(catalog.style_axes).length}</span></div>
          <div class="chips">${Object.entries(catalog.style_axes).map(([axis, data]) => {
            const target = (state.extraction.style_axis_targets || []).find(item => item.axis === axis);
            const label = target ? `${data.label} ${Number(target.target).toFixed(2)}` : data.label;
            return chip(`style:${axis}`, label, "type-selected");
          }).join("")}</div>
        </section>`);
      }

      for (const [typeCode, typeData] of Object.entries(catalog.category_groups)) {
        const rows = [];
        for (const [group, data] of Object.entries(typeData.groups)) {
          rows.push(`<div class="subgroup">
            <div class="group-title"><h2>${escapeHtml(group)}</h2><span>${data.values.length}</span></div>
            <div class="chips">${data.values.map(value => chip(`category:${typeCode}:${group}:${value}`, value)).join("")}</div>
          </div>`);
        }
        const open = categoryHasSelection(typeCode) ? "open" : "";
        parts.push(`<details class="category-section" ${open}>
          <summary>
            <div class="group-title"><h2>${escapeHtml(typeCode)} category</h2><span>${escapeHtml(typeData.domain)}</span></div>
          </summary>
          <div class="category-body">${rows.join("")}</div>
        </details>`);
      }

      els.catalog.innerHTML = parts.join("");
      renderCounts();
    }

    function renderCounts() {
      const common = state.extraction.common_filters?.length || 0;
      const category = state.extraction.category_filters?.length || 0;
      const excludedCommon = state.extraction.excluded_common_filters?.length || 0;
      const excludedCategory = state.extraction.excluded_category_filters?.length || 0;
      const styleTargets = state.extraction.style_axis_targets?.length || 0;
      els.typeCount.textContent = state.extraction.item_type_codes?.length || 0;
      els.filterCount.textContent = common + category + excludedCommon + excludedCategory + styleTargets;
      els.resultCount.textContent = state.results.length;
    }

    function renderResults() {
      if (!state.results.length) {
        els.results.innerHTML = `<div class="empty">조건을 만족하는 결과가 없습니다.</div>`;
        renderCounts();
        return;
      }
      els.results.innerHTML = state.results.map(item => {
        const image = item.image_file ? `/image/${encodeURIComponent(item.image_file)}` : "";
        const filters = item.mapped_attributes || item.matched_filters || [];
        const matchedFilters = item.matched_filters || [];
        const filterSummary = matchedFilters
          .map(filter => `${filter.group}: ${filter.value}`)
          .join(" · ");
        const components = item.score_components?.length
          ? `components ${item.score_components.join(" + ")}`
          : "";
        const scoreParts = [
          item.graph_score != null ? `graph ${Number(item.graph_score).toFixed(3)}` : "",
          item.text_score != null ? `text ${Number(item.text_score).toFixed(3)}` : "",
          item.style_score != null ? `style ${Number(item.style_score).toFixed(3)}` : ""
        ].filter(Boolean).join(" | ");
        const filterRows = filters.length
          ? filters.map(filter => `<div class="filter-row">
              <b>${escapeHtml(filterLabel(filter))}</b>
              <span>${Number(filter.score || 0).toFixed(3)}</span>
            </div>`).join("")
          : `<div class="item-meta">매핑된 항목이 없습니다.</div>`;
        return `<article class="item">
          ${image ? `<img src="${image}" alt="${escapeHtml(item.id || "item")}" loading="lazy">` : ""}
          <div class="item-body">
            <div class="item-title">${escapeHtml(item.id || "")}</div>
            <div class="item-meta">${escapeHtml(item.type_name || item.type_code || "")}</div>
            <div class="item-meta">score ${Number(item.score || 0).toFixed(3)}</div>
            ${components ? `<div class="item-meta">${escapeHtml(components)}</div>` : ""}
            ${scoreParts ? `<div class="item-meta">${escapeHtml(scoreParts)}</div>` : ""}
            <div class="item-meta">${escapeHtml(filterSummary)}</div>
            <details class="item-details">
              <summary>전체 매핑 항목 ${filters.length}개</summary>
              <div class="filter-list">${filterRows}</div>
            </details>
          </div>
        </article>`;
      }).join("");
      renderCounts();
    }

    function filterLabel(filter) {
      const prefix = filter.scope === "category" && filter.type_code
        ? `${filter.type_code}.${filter.group}`
        : filter.group;
      return `${prefix}: ${filter.value}`;
    }

    async function loadCatalog() {
      const response = await fetch("/api/catalog");
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || data.error || "catalog failed");
      state.catalog = data.catalog;
      els.model.innerHTML = data.models.map(model => {
        const selected = model === data.default_model ? "selected" : "";
        return `<option value="${escapeHtml(model)}" ${selected}>${escapeHtml(model)}</option>`;
      }).join("");
      els.status.textContent = "준비됨";
      renderCatalog();
    }

    async function runSearch(event) {
      event.preventDefault();
      els.run.disabled = true;
      els.status.textContent = "검색 중...";
      els.status.classList.remove("error");
      try {
        const payload = {
          query: els.query.value,
          model: els.model.value,
          limit: Number(els.limit.value || 20),
          min_confidence: els.confidence.value,
          min_score: els.score.value
        };
        const response = await fetch("/api/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || data.error || "search failed");
        state.extraction = data.extraction;
        state.results = data.results || [];
        els.cypher.textContent = data.cypher + "\n\nparams = " + JSON.stringify(data.params, null, 2);
        els.modelBadge.textContent = data.model;
        els.status.textContent = `완료 · ${state.results.length}개`;
        renderCatalog();
        renderResults();
      } catch (error) {
        els.status.textContent = error.message;
        els.status.classList.add("error");
      } finally {
        els.run.disabled = false;
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    els.form.addEventListener("submit", runSearch);
    loadCatalog().catch(error => {
      els.status.textContent = error.message;
      els.status.classList.add("error");
    });
  </script>
</body>
</html>
