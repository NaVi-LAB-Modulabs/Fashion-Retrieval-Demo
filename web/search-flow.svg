<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 12 15" role="img" aria-labelledby="title desc">
<title id="title">Fashion retrieval flow</title>
<desc id="desc">Hard filters run before attribute top 10 and filtered HNSW top 10. Their union is ranked by exact description similarity, required attributes and requested style axes.</desc>
<rect width="12" height="15" fill="#f8f9f5"/>
<text x="6" y="0.4499999999999993" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.3472222222222222" font-weight="700" fill="#203e32">Fashion retrieval flow</text>
<text x="6" y="0.8699999999999992" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.16666666666666666" font-weight="400" fill="#63756b">Hard filters → two candidate lists → weighted ranking</text>
<rect x="2" y="1.3000000000000007" width="8" height="0.75" rx="0.16" fill="#ffffff" stroke="#ccd7cd" stroke-width="0.017"/>
<text x="6.0" y="1.5899999999999999" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.20833333333333334" font-weight="700" fill="#253b36">English search query</text>
<polyline points="6,2.0500000000000007 6,2.3499999999999996" fill="none" stroke="#73877b" stroke-width="0.02"/>
<polygon points="6,2.3499999999999996 6.06,2.2299999999999995 5.94,2.2299999999999995" fill="#73877b"/>
<rect x="2" y="2.349999999999999" width="8" height="1.1" rx="0.16" fill="#ffffff" stroke="#ccd7cd" stroke-width="0.017"/>
<text x="6.0" y="2.639999999999999" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.20833333333333334" font-weight="700" fill="#253b36">Parse the query</text>
<text x="6.0" y="3.0108333333333324" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.16666666666666666" font-weight="400" fill="#4c5d56">Category · explicit attributes · exclusions</text>
<text x="6.0" y="3.269166666666665" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.16666666666666666" font-weight="400" fill="#4c5d56">Description query · requested style axes</text>
<polyline points="6,3.4499999999999993 6,3.8200000000000003" fill="none" stroke="#73877b" stroke-width="0.02"/>
<polygon points="6,3.8200000000000003 6.06,3.7 5.94,3.7" fill="#73877b"/>
<rect x="2" y="3.8199999999999994" width="8" height="1.3" rx="0.16" fill="#edf4e9" stroke="#ccd7cd" stroke-width="0.017"/>
<text x="6.0" y="4.109999999999998" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.20833333333333334" font-weight="700" fill="#253b36">1  Apply hard filters</text>
<text x="6.0" y="4.580833333333333" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.16666666666666666" font-weight="400" fill="#4c5d56">Named category + all required positive attributes</text>
<text x="6.0" y="4.8391666666666655" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.16666666666666666" font-weight="400" fill="#4c5d56">Excluded attributes remove matches; attribute threshold applies</text>
<polyline points="6,5.119999999999999 6,5.48" fill="none" stroke="#73877b" stroke-width="0.02"/>
<polygon points="6,5.48 6.06,5.36 5.94,5.36" fill="#73877b"/>
<rect x="2" y="5.48" width="8" height="0.9" rx="0.16" fill="#ffffff" stroke="#ccd7cd" stroke-width="0.017"/>
<text x="6.0" y="5.77" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.20833333333333334" font-weight="700" fill="#253b36">All items that pass the filters</text>
<text x="6.0" y="6.17" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.16666666666666666" font-weight="400" fill="#4c5d56">Both candidate lists use this population</text>
<polyline points="6,6.380000000000001 6,6.619999999999999 3.45,6.619999999999999 3.45,6.949999999999999" fill="none" stroke="#73877b" stroke-width="0.02"/>
<polygon points="3.45,6.949999999999999 3.5100000000000002,6.829999999999999 3.39,6.829999999999999" fill="#73877b"/>
<polyline points="6,6.380000000000001 6,6.619999999999999 8.55,6.619999999999999 8.55,6.949999999999999" fill="none" stroke="#73877b" stroke-width="0.02"/>
<polygon points="8.55,6.949999999999999 8.610000000000001,6.829999999999999 8.49,6.829999999999999" fill="#73877b"/>
<rect x="1.05" y="6.95" width="4.8" height="1.8" rx="0.16" fill="#edf4e9" stroke="#ccd7cd" stroke-width="0.017"/>
<text x="3.45" y="7.239999999999999" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.20833333333333334" font-weight="700" fill="#253b36">2a  Attribute top 10</text>
<text x="3.45" y="7.831666666666667" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.16666666666666666" font-weight="400" fill="#4c5d56">Combined score of required attributes</text>
<text x="3.45" y="8.09" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.16666666666666666" font-weight="400" fill="#4c5d56">confidence × group metric</text>
<text x="3.45" y="8.348333333333333" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.16666666666666666" font-weight="400" fill="#4c5d56">Omit this branch if none are required</text>
<rect x="6.15" y="6.95" width="4.8" height="1.8" rx="0.16" fill="#edf2fa" stroke="#ccd7cd" stroke-width="0.017"/>
<text x="8.55" y="7.239999999999999" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.20833333333333334" font-weight="700" fill="#2e4e75">2b  Description top 10</text>
<text x="8.55" y="7.831666666666667" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.16666666666666666" font-weight="400" fill="#4c5d56">Query embedding + stored descriptions</text>
<text x="8.55" y="8.09" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.16666666666666666" font-weight="400" fill="#4c5d56">Filtered HNSW (approximate top 10)</text>
<text x="8.55" y="8.348333333333333" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.16666666666666666" font-weight="400" fill="#4c5d56">Search all filtered, model-compatible IDs</text>
<polyline points="3.45,8.75 3.45,9.030000000000001 6,9.030000000000001 6,9.32" fill="none" stroke="#73877b" stroke-width="0.02"/>
<polygon points="6,9.32 6.06,9.200000000000001 5.94,9.200000000000001" fill="#73877b"/>
<polyline points="8.55,8.75 8.55,9.030000000000001 6,9.030000000000001 6,9.32" fill="none" stroke="#73877b" stroke-width="0.02"/>
<polygon points="6,9.32 6.06,9.200000000000001 5.94,9.200000000000001" fill="#73877b"/>
<rect x="2" y="9.32" width="8" height="0.98" rx="0.16" fill="#ffffff" stroke="#ccd7cd" stroke-width="0.017"/>
<text x="6.0" y="9.61" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.20833333333333334" font-weight="700" fill="#253b36">Merge IDs and remove duplicates</text>
<text x="6.0" y="10.05" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.16666666666666666" font-weight="400" fill="#4c5d56">At most 20 candidates</text>
<polyline points="6,10.3 6,10.68" fill="none" stroke="#73877b" stroke-width="0.02"/>
<polygon points="6,10.68 6.06,10.56 5.94,10.56" fill="#73877b"/>
<rect x="2" y="10.68" width="8" height="2.0" rx="0.16" fill="#eef0e6" stroke="#ccd7cd" stroke-width="0.017"/>
<text x="6.0" y="10.969999999999999" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.20833333333333334" font-weight="700" fill="#253b36">3  Calculate final scores</text>
<text x="6.0" y="11.661666666666667" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.16666666666666666" font-weight="400" fill="#4c5d56">Description: exact cosine similarity — 55%</text>
<text x="6.0" y="11.92" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.16666666666666666" font-weight="400" fill="#4c5d56">Attributes: same required attributes — 35%</text>
<text x="6.0" y="12.178333333333333" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.16666666666666666" font-weight="400" fill="#4c5d56">Style: only axes mentioned in the query — 10%</text>
<polyline points="2,2.9000000000000004 0.48,2.9000000000000004 0.48,11.8 2,11.8" fill="none" stroke="#73877b" stroke-width="0.02" stroke-dasharray="0.08 0.05"/>
<polygon points="2,11.8 1.88,11.74 1.88,11.860000000000001" fill="#73877b"/>
<text x="0.25" y="8.25" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.1388888888888889" font-weight="400" fill="#63756b" transform="rotate(-90 0.25 8.25)">Requested style targets → final scoring only</text>
<polyline points="6,12.68 6,13.05" fill="none" stroke="#73877b" stroke-width="0.02"/>
<polygon points="6,13.05 6.06,12.930000000000001 5.94,12.930000000000001" fill="#73877b"/>
<rect x="2" y="13.05" width="8" height="0.92" rx="0.16" fill="#ffffff" stroke="#ccd7cd" stroke-width="0.017"/>
<text x="6.0" y="13.34" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.20833333333333334" font-weight="700" fill="#253b36">Sort by final score → results</text>
<text x="6.0" y="13.75" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.16666666666666666" font-weight="400" fill="#4c5d56">Apply minimum final score and requested result limit</text>
<text x="6" y="14.35" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.1388888888888889" font-weight="400" fill="#63756b">Default weights are adjustable and normalized over available components.</text>
<text x="6" y="14.68" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, DejaVu Sans, sans-serif" font-size="0.1388888888888889" font-weight="400" fill="#63756b">No compatible embeddings: attribute candidates only. No eligible items: empty results.</text>
</svg>
