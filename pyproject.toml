[project]
name = "fashion-how-web"
version = "1.0.0"
description = "An explainable fashion retrieval research demo"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn>=0.30.0,<1.0",
    "openai>=1.40.0,<3.0",
    "neo4j>=5.20.0,<7.0",
    "python-dotenv>=1.0.0,<2.0",
    # CLIP query encoders (ONNX, CPU); models are downloaded from Hugging Face on first use.
    "onnxruntime>=1.20.0,<2.0",
    "tokenizers>=0.21.0,<1.0",
    "numpy>=1.26.0,<3.0",
]

[tool.vercel]
entrypoint = "web_app:app"
